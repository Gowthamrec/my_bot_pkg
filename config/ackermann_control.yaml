controller_manager:
  ros__parameters:
    update_rate: 100

    ackermann_steering_controller:
      type: ackermann_steering_controller/AckermannSteeringController

ackermann_steering_controller:
  ros__parameters:
    rear_wheels_names: ["rear_left_wheel_joint", "rear_right_wheel_joint"]
    front_steering_names: ["front_left_steering_joint", "front_right_steering_joint"]
    base_frame_id: base_link
    odom_frame_id: odom
    publish_rate: 50
    wheelbase: 1.0
    front_wheel_track: 0.5
    wheel_radius: 0.1
    enable_odom_tf: true
    use_stamped_vel: false
